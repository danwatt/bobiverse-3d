<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bobiverse — Stars Within 25 Light-Years</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Top-left: scene info + display toggles -->
    <div class="panel panel--top-left">
      <h1>Local Bubble</h1>
      <p class="subtle"><span id="star-count">0</span> systems within <span id="horizon-ly">25</span> ly</p>
      <div class="field">
        <span class="field-label">Label</span>
        <div class="seg" id="label-mode" role="group" aria-label="Which systems to label">
          <button class="btn btn--seg is-active" data-label-mode="major">Major</button>
          <button class="btn btn--seg" data-label-mode="visited">Visited</button>
          <button class="btn btn--seg" data-label-mode="all">All</button>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="toggle-grid" checked />
        Reference grid &amp; markers
      </label>
      <label class="check">
        <input type="checkbox" id="toggle-routes" checked />
        Voyage routes
      </label>
      <p class="credit">
        Stars:
        <a href="https://codeberg.org/astronexus/hyg" target="_blank" rel="noopener">HYG</a> ·
        Timeline:
        <a href="https://github.com/thunfischtoast/bobiverse-map" target="_blank" rel="noopener">bobiverse-map</a>
        · both CC BY-SA 4.0
      </p>
    </div>

    <!-- Top-right: selected system details -->
    <div class="panel panel--top-right" id="info-panel" hidden>
      <button class="close" id="info-close" aria-label="Close">&times;</button>
      <h2 id="info-name">—</h2>
      <p class="subtle" id="info-distance"></p>
      <ul id="info-components"></ul>
      <div id="info-presence" hidden>
        <h3 class="info-heading">Bobs in system</h3>
        <ul id="info-bobs" class="bob-list"></ul>
      </div>
    </div>

    <!-- Bottom: timeline -->
    <div class="panel panel--bottom" id="timeline-panel">
      <div class="timeline-row">
        <button id="play-toggle" class="btn btn--play" title="Play / pause">▶</button>
        <input type="range" id="year-slider" class="slider" />
        <div class="year-box">
          <input type="number" id="year-input" class="year-input" step="1" />
          <span class="subtle">CE</span>
        </div>
        <div class="speeds" role="group" aria-label="Playback speed">
          <button class="btn btn--speed" data-speed="0.25">0.25&times;</button>
          <button class="btn btn--speed is-active" data-speed="1">1&times;</button>
          <button class="btn btn--speed" data-speed="4">4&times;</button>
        </div>
      </div>
      <div class="timeline-row timeline-row--fleet">
        <ul id="fleet-list" class="fleet-list"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
